<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LumenLab 用户反馈通知</title>
</head>
<body style="margin:0;padding:0;background-color:#f6f7fb;font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif;">
  <div style="max-width:520px;margin:24px auto;background:#ffffff;border-radius:14px;padding:32px;">
    <h1 style="font-size:18px;color:#1a1d29;margin:0 0 16px;">LumenLab 用户反馈通知</h1>
    <p style="font-size:14px;color:#4a4f63;line-height:1.7;margin:0 0 16px;">管理员您好，您的产品 LumenLab 刚刚收到一条新的用户反馈。以下是这条反馈的详细信息，您可以登录管理后台查看完整列表并进行处理。</p>
    <div style="background:#f6f7fb;border-radius:10px;padding:16px;margin:0 0 16px;">
      <p style="font-size:13px;color:#4a4f63;line-height:2;margin:0;">反馈类型：{{category}}</p>
      <p style="font-size:13px;color:#4a4f63;line-height:2;margin:0;">反馈用户：{{userEmail}}</p>
      <p style="font-size:13px;color:#4a4f63;line-height:2;margin:0;">所在页面：{{pagePath}}</p>
      <p style="font-size:13px;color:#4a4f63;line-height:2;margin:0;">联系方式：{{contact}}</p>
      <p style="font-size:13px;color:#4a4f63;line-height:2;margin:0;">提交时间：{{time}}</p>
    </div>
    <p style="font-size:13px;color:#8a8fa3;margin:0 0 6px;">反馈内容：</p>
    <p style="font-size:14px;color:#1a1d29;line-height:1.8;margin:0 0 20px;white-space:pre-wrap;word-break:break-word;">{{content}}</p>
    <p style="margin:0 0 16px;"><a href="https://lab.mkynstudio.top/admin/feedback" style="display:inline-block;background:#5a5fe1;color:#ffffff;text-decoration:none;padding:10px 24px;border-radius:10px;font-size:14px;">前往管理后台处理</a></p>
    <p style="font-size:12px;color:#8a8fa3;line-height:1.7;margin:0;">本邮件由 LumenLab 系统自动发送给管理员，用于产品用户反馈的及时通知，请勿直接回复本邮件。如果您认为本邮件发送有误，请登录管理后台核实反馈记录。</p>
  </div>
</body>
</html>
